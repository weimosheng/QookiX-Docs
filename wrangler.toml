name = "qookix-launcher-web"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# 静态资源（next build 的 out/ 目录）
[assets]
directory = "./out"
binding = "ASSETS"
# /api/* 请求先走 Worker 动态处理，其余按静态资源服务
run_worker_first = ["/api/*"]

# release 数据缓存（SWR：先返回缓存，后台刷新）
[[kv_namespaces]]
binding = "QOOKIX_RELEASES"
id = "4f90ac6581d64cec8b310cdd43734c7e"

[observability]
enabled = true
